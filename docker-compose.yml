# Backend and Postgres for the prediction history.
# Usage: copy .env.example to .env, set a password, then `docker compose up --build`.
# The frontend is not part of this file yet; run it with `npm run dev` (see README).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    # Memory and process limits only. Capabilities are left alone: the entrypoint
    # changes the owner of the data directory and switches to the postgres user.
    mem_limit: 512m
    # One process per connection: 100 connections (the Postgres default) plus the
    # background workers still fit.
    pids_limit: 256
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Only on this machine, for running the backend outside Docker.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build: ./backend
    restart: unless-stopped
    # Measured outside Docker (Windows): ~400 MiB after start-up, ~1040 MiB at most while
    # torch loads, ~780 MiB during two 4096x4096 predictions with Grad-CAM at once
    # (MAX_CONCURRENT_INFERENCES=2). Raise it together with MAX_CONCURRENT_INFERENCES.
    mem_limit: 1500m
    cpus: 2
    pids_limit: 200
    # The server runs as an unprivileged user on port 8000 and needs no capabilities,
    # nor may it gain any (e.g. through a setuid binary).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MODEL_PATH: /srv/models/resnet18_v2c_best.pt
      MODEL_VERSION: resnet18_v2c
      DEVICE: ${DEVICE:-cpu}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      MAX_PIXELS: ${MAX_PIXELS:-16777216}
      MAX_IMAGE_SIDE: ${MAX_IMAGE_SIDE:-4096}
      MAX_CONCURRENT_INFERENCES: ${MAX_CONCURRENT_INFERENCES:-2}
      MAX_QUEUE: ${MAX_QUEUE:-20}
      LOW_CONFIDENCE_THRESHOLD: ${LOW_CONFIDENCE_THRESHOLD:-0.9}
      NOT_MRI_COLOR_MAX: ${NOT_MRI_COLOR_MAX:-7}
      NOT_MRI_NOISE_MAX: ${NOT_MRI_NOISE_MAX:-0.85}
      NOT_MRI_STD_MIN: ${NOT_MRI_STD_MIN:-10}
      NOT_MRI_LOWCONTRAST_STD: ${NOT_MRI_LOWCONTRAST_STD:-30}
      NOT_MRI_DARK_MIN: ${NOT_MRI_DARK_MIN:-0.15}
      ENABLE_DOCS: ${ENABLE_DOCS:-true}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      # Swagger UI at http://127.0.0.1:${API_PORT} sends that origin, so it follows API_PORT.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost:${API_PORT:-8000},http://127.0.0.1:${API_PORT:-8000}}
    volumes:
      - ./backend/models:/srv/models:ro
    # Bring the schema up to date, then start the server.
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      # No authentication yet, so the API is published on localhost only.
      - "127.0.0.1:${API_PORT:-8000}:8000"

volumes:
  pgdata:
