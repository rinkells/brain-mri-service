# The whole application: nginx with the built interface (frontend), the API and Postgres
# for the prediction history. Usage: copy .env.example to .env, set a password, then
# `docker compose up --build` and open http://localhost:8080.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    # Memory and process limits only. Capabilities are left alone: the entrypoint
    # changes the owner of the data directory and switches to the postgres user.
    mem_limit: 512m
    # One process per connection: 100 connections (the Postgres default) plus the
    # background workers still fit.
    pids_limit: 256
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Only on this machine, for running the backend outside Docker.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build: ./backend
    restart: unless-stopped
    # Measured outside Docker (Windows): ~400 MiB after start-up, ~1040 MiB at most while
    # torch loads, ~780 MiB during two 4096x4096 predictions with Grad-CAM at once
    # (MAX_CONCURRENT_INFERENCES=2). Raise it together with MAX_CONCURRENT_INFERENCES.
    mem_limit: 1500m
    cpus: 2
    pids_limit: 200
    # The server runs as an unprivileged user on port 8000 and needs no capabilities,
    # nor may it gain any (e.g. through a setuid binary).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MODEL_PATH: /srv/models/resnet18_v2c_best.pt
      MODEL_VERSION: resnet18_v2c
      DEVICE: ${DEVICE:-cpu}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      MAX_PIXELS: ${MAX_PIXELS:-16777216}
      MAX_IMAGE_SIDE: ${MAX_IMAGE_SIDE:-4096}
      MAX_CONCURRENT_INFERENCES: ${MAX_CONCURRENT_INFERENCES:-2}
      MAX_QUEUE: ${MAX_QUEUE:-20}
      LOW_CONFIDENCE_THRESHOLD: ${LOW_CONFIDENCE_THRESHOLD:-0.9}
      NOT_MRI_COLOR_MAX: ${NOT_MRI_COLOR_MAX:-7}
      NOT_MRI_NOISE_MAX: ${NOT_MRI_NOISE_MAX:-0.85}
      NOT_MRI_STD_MIN: ${NOT_MRI_STD_MIN:-10}
      NOT_MRI_LOWCONTRAST_STD: ${NOT_MRI_LOWCONTRAST_STD:-30}
      NOT_MRI_DARK_MIN: ${NOT_MRI_DARK_MIN:-0.15}
      NOT_MRI_OPAQUE_MIN: ${NOT_MRI_OPAQUE_MIN:-0.99}
      ENABLE_DOCS: ${ENABLE_DOCS:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_PREDICT_PER_MINUTE: ${RATE_LIMIT_PREDICT_PER_MINUTE:-10}
      RATE_LIMIT_WRITE_PER_MINUTE: ${RATE_LIMIT_WRITE_PER_MINUTE:-30}
      RATE_LIMIT_READ_PER_MINUTE: ${RATE_LIMIT_READ_PER_MINUTE:-120}
      # Only nginx of the frontend service may name the client (X-Real-IP). Not the whole
      # network: direct connections to the published port 8000 come from its gateway.
      TRUSTED_PROXIES: 172.30.250.10
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      # Swagger UI at http://127.0.0.1:${API_PORT} sends that origin, so it follows API_PORT.
      # The interface of the frontend service (port 8080) sends http://localhost:8080.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost:${API_PORT:-8000},http://127.0.0.1:${API_PORT:-8000},http://localhost:8080,http://127.0.0.1:8080}
    volumes:
      - ./backend/models:/srv/models:ro
    # Bring the schema up to date, then start the server. Proxy headers are left to the
    # app (see the Dockerfile).
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers"]
    ports:
      # No authentication yet, so the API is published on localhost only.
      - "127.0.0.1:${API_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # The interface refuses larger files before sending them, like the API does.
        VITE_MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    restart: unless-stopped
    # nginx serving static files and forwarding the API paths needs little.
    mem_limit: 128m
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Nothing in the image is written to; nginx keeps its pid and temporary files in /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      # The interface, on this machine only, like the API.
      - "127.0.0.1:8080:8080"
    networks:
      default:
        # Fixed, so the API can trust exactly this address (TRUSTED_PROXIES).
        ipv4_address: 172.30.250.10

volumes:
  pgdata:

networks:
  default:
    ipam:
      config:
        # If this clashes with another network on the machine, change the subnet, the
        # address of frontend and TRUSTED_PROXIES of api together.
        - subnet: 172.30.250.0/24
          # Addresses handed out to the other containers: outside it sits the fixed one.
          ip_range: 172.30.250.128/25
