[pytest]
testpaths = tests
pythonpath = .
# SQLite cannot reflect the index on lower(username) (migration 0005), so Alembic and
# SQLAlchemy skip it with these warnings; test_database.py checks that index directly.
filterwarnings =
    ignore:Skipped unsupported reflection of expression-based index uq_users_username_lower
    ignore:autogenerate skipping metadata-specified expression-based index 'uq_users_username_lower'
