# The built interface and a reverse proxy to the API ("api" in Compose).
# Replaces /etc/nginx/conf.d/default.conf of the nginx-unprivileged image.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # A little above MAX_UPLOAD_MB (10): a file just over the limit still reaches the API,
    # which answers 413 with its own explanation. Raise both together.
    client_max_body_size 12m;
    # An analysis can wait in the API queue; a large Grad-CAM answer takes time to send.
    send_timeout 120s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # On every response, errors included. The hash allows the one inline script of
    # index.html, which applies the theme before the first paint; any change to that
    # script needs a new hash here (backend/tests/test_deployment.py checks it).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-7sO5zkRnKi7oHcHoMz6kw+Khv6PHKItOaxpfhVKMZ2E='; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # --- API ------------------------------------------------------------------
    # Only the paths the interface calls, as the Vite dev proxy lists them, and
    # /health/ready for checking the deployment through this port. Swagger UI, ReDoc and
    # the schema stay on the API port for development.

    # Docker's DNS, so a restarted api container is found at its new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    # The Host the browser sent (e.g. localhost:8080), as ALLOWED_HOSTS expects. The
    # browser's Origin header is passed on unchanged for the ALLOWED_ORIGINS check.
    proxy_set_header Host $http_host;
    # The address nginx sees, replacing any X-Real-IP the client sent. The API takes the
    # client from it for the rate limit, and only from this container (TRUSTED_PROXIES).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    # The API sets these itself; nginx adds the same values above, so they are not sent twice.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;

    location = /health {
        proxy_pass $api;
    }

    location = /health/ready {
        proxy_pass $api;
    }

    location = /predict {
        # Scans and heat maps pass straight through instead of being kept in /tmp.
        proxy_request_buffering off;
        proxy_buffering off;
        gzip off;
        proxy_pass $api;
    }

    location = /predictions {
        proxy_pass $api;
    }

    location ^~ /predictions/ {
        proxy_pass $api;
    }

    location = /stats {
        proxy_pass $api;
    }

    # Accounts: register, sign in and out, the current user. Set-Cookie from the API and
    # the browser's Cookie pass through unchanged.
    location ^~ /auth/ {
        proxy_pass $api;
    }

    # --- Interface --------------------------------------------------------------

    # File names with a content hash (Vite build): they never change.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # index.html and the rest are checked with the server on every load.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
